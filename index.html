<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configurador de Invernaderos</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Configurador de Invernaderos</h1>
    <div class="subtitle">Dise&ntilde;o, visualizaci&oacute;n y propuesta comercial &mdash; MVP v0.3 estructural</div>
  </header>

  <main class="layout">
    <!-- ============ PANEL IZQUIERDO: CONFIGURACIÓN ============ -->
    <aside class="config-panel">
      <h2>Modelo base</h2>
      <div class="field">
        <select id="model-select"></select>
      </div>
      <p class="hint" id="model-description"></p>

      <h2>Dimensiones</h2>
      <div class="field">
        <label>N.&ordm; de naves (ancho)</label>
        <input type="number" id="num-naves" min="1" max="20" value="2">
      </div>
      <div class="field">
        <label>N.&ordm; de tramos entre pilares (largo)</label>
        <input type="number" id="num-tramos" min="1" max="100" value="20">
      </div>

      <h2>Proyecto</h2>
      <div class="field">
        <label>C&oacute;digo del proyecto</label>
        <input type="text" id="codigo-proyecto" placeholder="Ej. 26JD001">
      </div>
      <div class="field">
        <label>Cliente</label>
        <input type="text" id="cliente" placeholder="Nombre del cliente">
      </div>
      <div class="field">
        <label>Ubicaci&oacute;n</label>
        <input type="text" id="ubicacion" placeholder="Localidad, provincia">
      </div>

      <h2>Opciones</h2>
      <div id="opciones"></div>

      <button id="btn-propuesta" class="btn-primary">📄 Generar propuesta comercial</button>
    </aside>

    <!-- ============ PANEL DERECHO: VISTA PREVIA ============ -->
    <section class="preview-panel">

      <!-- Tabs de vistas -->
      <div class="tabs">
        <button class="tab active" data-vista="planta">Planta</button>
        <button class="tab" data-vista="alzado-frontal">Alzado frontal</button>
        <button class="tab" data-vista="alzado-lateral">Alzado lateral</button>
        <button class="tab" data-vista="seccion">Secci&oacute;n transversal</button>
      </div>

      <!-- SVG del plano -->
      <div class="plan-box">
        <svg id="plan" viewBox="0 0 900 520"></svg>
      </div>

      <!-- Resumen + precio -->
      <div class="summary-box" id="summary"></div>

      <!-- Especificaciones técnicas -->
      <div class="specs-box" id="especificaciones"></div>
    </section>
  </main>

  <footer>
    Prototipo MVP v0.3 estructural &mdash; datos placeholder. Sustituir por cat&aacute;logo real de f&aacute;brica antes de uso comercial.
  </footer>

  <!-- ============ MODO PROPUESTA (overlay imprimible) ============ -->
  <div id="modo-propuesta-overlay">
    <div class="toolbar-propuesta no-print">
      <button id="btn-cerrar-propuesta">← Volver al configurador</button>
      <span class="titulo-propuesta">Propuesta comercial · Vista previa</span>
      <button id="btn-imprimir" class="btn-primary">🖨️ Imprimir / Guardar como PDF</button>
    </div>
    <div id="propuesta-container"></div>
  </div>

  <script src="js/modelos.js"></script>
  <script src="js/opciones.js"></script>
  <script src="js/calculos.js"></script>
  <script src="js/planos.js"></script>
  <script src="js/propuesta.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
